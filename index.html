<style>
/* Layout: phone-first single column; scorecard numerals (condensed) for every figure, quiet sans for words. */

  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1411; --surface:#16201a; --ink:#e5ebe6; --muted:#98a69d; --faint:#6d7b72; --line:#27322b;
  --accent:#5eb083; --accent-ink:#0b1a12; --soft:#1b3226; --flag:#e0a650; --flag-soft:#3a2d18; --bad:#e07a6a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1411; --surface:#16201a; --ink:#e5ebe6; --muted:#98a69d; --faint:#6d7b72; --line:#27322b;
  --accent:#5eb083; --accent-ink:#0b1a12; --soft:#1b3226; --flag:#e0a650; --flag-soft:#3a2d18; --bad:#e07a6a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));font-size:15px;-webkit-text-size-adjust:100%}
html{color-scheme:light}@media (prefers-color-scheme: dark){html{color-scheme:dark}}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
main{display:flex;flex-direction:column;gap:12px;min-width:0}

.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}

.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;background:var(--line);border-radius:10px;padding:3px;gap:3px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:600 14px var(--body);padding:8px 4px;border-radius:8px;cursor:pointer}

.record{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media (min-width:560px){.record{grid-template-columns:repeat(5,1fr)}}
.cell .c{font-size:11px;line-height:1.2;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;min-height:2.4em;padding:0 2px}
.cell{border:1px solid var(--line);border-radius:8px;padding:6px 2px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.cell .d{font:600 18px/1 var(--display);width:40px;height:30px;display:grid;place-items:center;border-radius:50%}
.cell.count .d{border:2px solid var(--accent);color:var(--accent)}
.cell.old{background:var(--flag-soft)}
.cell small{font-size:10px;color:var(--faint)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}

.list{display:flex;flex-direction:column}

.li .r small{display:block;font:400 11px var(--body);color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--accent);margin-top:4px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th.n{text-align:right}
.tbl td.n,.tbl td.y{font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums}
.tbl td.n{text-align:right}
.scroll{overflow-x:auto}
input,select{font:16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 12px;width:100%;min-width:0;max-width:100%;height:46px;display:block;margin:0}
input[type=date]{-webkit-appearance:none;appearance:none;text-align:left;line-height:46px}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date]::-webkit-calendar-picker-indicator{opacity:.6}
select{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.grid2>*,.grid3>*{min-width:0}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.picker{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.picker button{display:block;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:9px 12px;color:var(--ink);font:14px var(--body);cursor:pointer}
.picker button:first-child{border-top:0}
.picker button small{color:var(--muted)}
.picker button[aria-selected="true"]{background:var(--soft)}
.sheet-bg{position:fixed;left:0;right:0;top:0;height:var(--vvh,100%);background:rgba(10,16,12,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:calc(var(--vvh,100vh) - 24px);overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:18px 18px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}

.preview b{font:700 20px var(--display);display:block}
.lockscroll,.lockscroll body{overflow:hidden}
.chbig{display:flex;align-items:center;gap:16px;background:var(--soft);border-radius:12px;padding:14px 16px}

.segw{display:flex;background:var(--line);border-radius:10px;padding:3px;gap:3px}
.segw button{flex:1;border:0;background:transparent;color:var(--muted);font:600 14px var(--body);padding:9px 4px;border-radius:8px;cursor:pointer}

.segw button:disabled{opacity:.35;cursor:default}
.rules{display:flex;flex-direction:column;gap:6px;font-size:14px}
.rules div{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:6px}
.rules div:first-child{border-top:0;padding-top:0}.rules span{color:var(--muted)}.rules b{text-align:right}
.lede{margin:0;font:600 19px/1.3 var(--display);letter-spacing:.005em;text-wrap:balance}
.insights{display:flex;flex-direction:column}
.ins{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.ins:first-child{border-top:0;padding-top:2px}
.ins b{font-weight:600}.ins span{color:var(--muted)}
.ins.tap{cursor:pointer}.ins.tap b::after{content:" ›";color:var(--accent)}
.stale{color:var(--flag);font-weight:600}
.tabs button{font-size:13px}
.tbl tr.tap{cursor:pointer}.tbl tr.tap:active td,.li.tap:active{background:var(--soft)}
.tbl tr.tap td:first-child{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 0;flex:none}
.sheet{touch-action:pan-y;will-change:transform}
.sheet>*{flex-shrink:0}
.sheet .row-head{flex-wrap:nowrap;align-items:flex-start}.sheet .row-head h3{min-width:0}.sheet .row-head .linkbtn{flex:none;margin-top:4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:8px 12px;font:500 13px var(--body);cursor:pointer;white-space:nowrap}
.chip small{color:var(--muted);margin-left:4px}
.stat4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat4 div{border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center}
.stat4 b{display:block;font:700 22px/1.1 var(--display)}.stat4 small{font-size:11px;color:var(--muted)}
.teelist{display:flex;flex-direction:column;gap:6px}
.teerow{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.teerow small{display:block;color:var(--muted);font-size:12px}
.picked{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px}
.picked small{display:block;color:var(--muted);font-size:12px}
.picked .linkbtn{flex:none}
.li.tap{cursor:pointer}
.tbl td.y{white-space:nowrap}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:40px 12px}
.note{font-size:12px;color:var(--faint)}
.foot{display:flex;justify-content:center;align-items:center;gap:12px;padding:20px 0 8px;font-size:13px;color:var(--faint)}
.linkbtn{background:none;border:0;padding:4px 2px;color:var(--accent);font:600 13px var(--body);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25);transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:99px;font-size:14px;z-index:30}
.yearhead{font:700 18px var(--display);padding:14px 0 4px;color:var(--muted)}
.rowbtn{all:unset;display:contents;cursor:pointer}
.expand{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;padding-top:8px;align-items:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
@media (max-width:380px){.hero{grid-template-columns:1fr;justify-items:start}.record{grid-template-columns:repeat(3,1fr)}}

<div class="wrap">
  <header class="top">

    <div class="tabs" role="tablist">
      <button role="tab" id="tab-overview" aria-selected="true" data-tab="overview">Overview</button>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>
/* ---------- WHS engine ---------- */
function r1(x){return Math.round(x*10+1e-9)/10}
function expected9(hi){return hi*0.52+1.2}
function fewTable(d){const n=d.length;if(n<3)return null;const a=k=>d.slice(0,k).reduce((s,x)=>s+x,0)/k;
  if(n===3)return{v:d[0]-2,k:1};if(n===4)return{v:d[0]-1,k:1};if(n===5)return{v:d[0],k:1};if(n===6)return{v:a(2)-1,k:2};
  if(n<=8)return{v:a(2),k:2};if(n<=11)return{v:a(3),k:3};if(n<=14)return{v:a(4),k:4};if(n<=16)return{v:a(5),k:5};
  if(n<=18)return{v:a(6),k:6};if(n===19)return{v:a(7),k:7};return{v:a(8),k:8}}
function sortRounds(rs){return rs.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:((a.seq||1)-(b.seq||1))||((a.createdAt||0)-(b.createdAt||0)))}
function computeAll(rounds){
  const rs=sortRounds(rounds),out=[],hist=[];let hi=null;
  for(const r of rs){
    const nine=r.holes!=='18',raw=(113/r.slope)*(r.score-r.rating);
    const diff=nine?(hi==null?null:r1(r1(raw)+expected9(hi))):r1(raw);
    const rec={...r,raw:r1(raw),diff,adj:0,hiBefore:hi};out.push(rec);
    if(diff==null){rec.hiAfter=hi;continue}
    if(hi!=null){const g=hi-diff,e=g>=10?2:g>=7?1:0;if(e){rec.esr=e;out.filter(o=>o.diff!=null).slice(-20).forEach(o=>o.adj-=e)}}
    const pool=out.filter(o=>o.diff!=null).slice(-20);
    const t=fewTable(pool.map(o=>o.diff+o.adj).sort((a,b)=>a-b));
    if(t){let v=t.v;
      if(pool.length>=20){const cut=new Date(Date.parse(r.date)-365*864e5).toISOString().slice(0,10);
        const lows=hist.filter(h=>h.date>=cut&&h.date<r.date&&h.n>=20).map(h=>h.hi);
        if(lows.length){const low=Math.min(...lows);let inc=v-low;if(inc>3){inc=Math.min(3+(inc-3)/2,5);v=low+inc;rec.capped=true}}}
      hi=Math.min(r1(v),54)}
    rec.hiAfter=hi;hist.push({date:r.date,hi,n:pool.length});
  }
  return out;
}
function currentRecord(out){const pool=out.filter(o=>o.diff!=null).slice(-20);
  const ds=pool.map(o=>({o,d:o.diff+o.adj})).sort((a,b)=>a.d-b.d);const t=fewTable(ds.map(x=>x.d));const k=t?t.k:0;
  return{pool,counting:new Set(ds.slice(0,k).map(x=>x.o.id)),k,threshold:k?ds[k-1].d:null}}

/* ---------- version ---------- */
const VERSION = '1.8';   // bump on every change so Check for update can see it

/* ---------- state ---------- */
const S={rounds:[],courses:[],calc:[],tab:'overview',range:'all',diffRange:'all',slopeRange:'3y',db:null,canWrite:true,expanded:null,q:'',cq:'',ready:{r:false,c:false},version:0};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtD=d=>{const [y,m,dd]=d.split('-');return `${+m}/${+dd}/${y.slice(2)}`};
const fmtLong=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
const todayStr=()=>{const t=new Date();return new Date(t-t.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const daysAgo=n=>{const t=new Date(Date.now()-n*864e5);return new Date(t-t.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const holesLabel=h=>h==='18'?'18':h==='F9'?'Front 9':'Back 9';
const fx=(v,d=1)=>v==null||isNaN(v)?'—':v.toFixed(d);
const hiStr=v=>v==null?'—':(v<0?'+'+(-v).toFixed(1):v.toFixed(1));
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200)}
const courseKey=(c,t,h)=>`${c}|${t}|${h==='18'?'18':'9'}`.toLowerCase();

/* ---------- derived ---------- */
function derive(){
  S.calc=computeAll(S.rounds);
  // play stats per course (by name)
}
function roundsCount(list){return list.reduce((s,r)=>s+(r.holes==='18'?1:.5),0)}

/* ---------- charts ---------- */
function attachTip(el,points,fmt,opts={}){ // points: [{x,y,...}] in px
  const tip=el.querySelector('.tip'),cross=el.querySelector('.cross'),dot=el.querySelector('.hov');
  function show(px){if(!points.length)return;let best=points[0],bd=1e9;
    for(const p of points){const d=Math.abs(p.x-px)+(opts.useY?0:0);if(d<bd){bd=d;best=p}}
    tip.hidden=false;tip.innerHTML=fmt(best);
    const w=el.clientWidth;tip.style.left=Math.min(Math.max(best.x,70),w-70)+'px';if(best.y<56){tip.style.top=(best.y+14)+'px';tip.style.transform='translate(-50%,0)'}else{tip.style.top=(best.y-10)+'px';tip.style.transform=''}

function niceTicks(min,max,count=4){const span=max-min||1;const step0=span/count;const mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=step0)||mag*10;const out=[];const end=Math.ceil(max/step-1e-9)*step;for(let v=Math.floor(min/step+1e-9)*step;v<=end+1e-9;v+=step)out.push(+v.toFixed(6));return out}
function timeChart(host,series,opt){
  // series: [{pts:[{t,v,...}], kind:'line'|'dots', cls}]

  const all=series.flatMap(s=>s.pts);if(!all.length){host.innerHTML='<p class="note">Not enough rounds yet.</p>';return}
  const t0=Math.min(...all.map(p=>p.t)),t1=Math.max(...all.map(p=>p.t));
  let v0=Math.min(...all.map(p=>p.v)),v1=Math.max(...all.map(p=>p.v));const pad=(v1-v0)*.08||1;v0-=pad;v1+=pad;

  let g='';ticks.forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`});
  // x ticks: years
  const y0=new Date(t0).getFullYear(),y1=new Date(t1).getFullYear();const yrs=[];for(let y=y0+1;y<=y1;y++)yrs.push(y);
  const every=Math.ceil(yrs.length/(W<420?4:7))||1;
  yrs.forEach((y,i)=>{const t=Date.UTC(y,0,1);if(t<t0||t>t1)return;const x=X(t);g+=`<line x1="${x}" x2="${x}" y1="${T}" y2="${H-B}" stroke="var(--line)" stroke-dasharray="2 3"/>`;if(i%every===0)g+=`<text x="${x}" y="${H-6}" text-anchor="middle">${y}</text>`});
  if(!yrs.length||t1-t0<200*864e5){[t0,t1].forEach((t,i)=>g+=`<text x="${X(t)}" y="${H-6}" text-anchor="${i?'end':'start'}">${fmtD(new Date(t).toISOString().slice(0,10))}</text>`)}
  let marks='';
  for(const s of series){
    if(s.kind==='line'){const d=s.pts.map((p,i)=>`${i?'L':'M'}${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
      if(s.area)marks+=`<path d="${d}L${X(s.pts[s.pts.length-1].t)},${H-B}L${X(s.pts[0].t)},${H-B}Z" fill="var(--soft)" opacity=".8"/>`;
      marks+=`<path d="${d}" fill="none" stroke="${s.color||'var(--accent)'}" stroke-width="${s.w||2}" stroke-linejoin="round" stroke-linecap="round"/>`}
    else marks+=s.pts.map(p=>`<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="${p.rad||3}" fill="${p.fill||s.color}" stroke="var(--surface)" stroke-width="1"/>`).join('')}
  let extra='';(opt.markers||[]).forEach(m=>{extra+=`<circle cx="${X(m.t)}" cy="${Y(m.v)}" r="5" fill="var(--flag)" stroke="var(--surface)" stroke-width="2"/>`});
  const end=opt.endpoint;if(end)extra+=`<circle cx="${X(end.t)}" cy="${Y(end.v)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(opt.label)}">${g}${marks}${extra}
   <line class="cross" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-width="1" style="display:none"/>
   <circle class="hov" r="5" fill="none" stroke="var(--ink)" stroke-width="2" style="display:none"/></svg><div class="tip" hidden></div>`;
  const tp=(opt.tipSeries?opt.tipSeries:series[0]).pts.map(p=>({...p,x:X(p.t),y:Y(p.v)}));
  attachTip(host,tp,opt.fmt);
}
function barChart(host,items,opt){ // items [{label,v,tip}]
  const W=Math.max(280,host.clientWidth),H=opt.h||170,L=26,R=6,T=opt.valueLabels?22:16,B=22;
  const vmax=Math.max(...items.map(i=>i.v),1);const ticks=niceTicks(0,vmax,3);const top=ticks[ticks.length-1];

  <section class="card"><div class="list">${cs.map(c=>{const ps=play.get(courseKey(c.course,c.tee,c.holes))||[];
   return `<div class="li tap" data-drill="course:${encodeURIComponent(c.course)}" role="button" tabindex="0"><div class="t">${esc(c.course)}<div class="m">${esc(c.tee)} · ${c.holes==='18'?'18 holes':'9 holes'} · ${fx(c.rating)} / ${c.slope}${ps.length?` · avg ${fx(avg(ps.map(p=>p.score)))}`:''}</div></div>
   <div class="r num">${ps.length}<small>played</small></div></div>`}).join('')||'<p class="note">No courses match.</p>'}</div></section>`;
}

function rangeStart(k){return k==='1y'?daysAgo(365):k==='3y'?daysAgo(365*3):'0000'}
function drawCharts(){
  const C=S.calc,T=d=>Date.parse(d+'T12:00:00Z');
  const hiPts=C.filter(x=>x.hiAfter!=null&&x.date>=rangeStart(S.range)).map(x=>({t:T(x.date),v:x.hiAfter,r:x}));
  const el=$('#hiChart');
  if(el){const lowP=hiPts.reduce((b,p)=>!b||p.v<=b.v?p:b,null);
    timeChart(el,[{pts:hiPts,kind:'line',area:true}],{h:210,label:'Handicap index over time',markers:lowP?[lowP]:[],endpoint:hiPts[hiPts.length-1],
      fmt:p=>`<b>${hiStr(p.v)}</b> after ${fmtD(p.r.date)}<br>${esc(p.r.course.slice(0,32))} · ${p.r.score}`})}
  const d=C.filter(x=>x.diff!=null);const roll=d.map((x,i)=>({t:T(x.date),v:avg(d.slice(Math.max(0,i-19),i+1).map(o=>o.diff)),r:x}));
  const rs=rangeStart(S.diffRange);
  const dp=d.filter(x=>x.date>=rs).map(x=>({t:T(x.date),v:x.diff,r:x,r_:3}));
  const el2=$('#diffChart');if(el2)timeChart(el2,[{pts:dp.map(p=>({...p,rad:3.2,fill:'color-mix(in srgb, var(--accent) 45%, transparent)'})),kind:'dots',color:'var(--accent)'},{pts:roll.filter(p=>p.r.date>=rs),kind:'line',color:'var(--ink)',w:2}],
    {h:210,label:'Score differentials',tipSeries:{pts:dp},fmt:p=>`<b>${fx(p.v)}</b> · ${p.r.score} at ${esc(p.r.course.slice(0,28))}<br>${fmtD(p.r.date)} · ${esc(p.r.tee)}`});
  drawSlope();
  // years
  const ys=new Map();C.forEach(r=>{const y=r.date.slice(0,4);if(!ys.has(y))ys.set(y,[]);ys.get(y).push(r)});
  const y0=Math.min(...[...ys.keys()].map(Number)),y1=Math.max(...[...ys.keys()].map(Number));const yi=[];
  for(let y=y0;y<=y1;y++){const rr=ys.get(String(y))||[];const r18=rr.filter(r=>r.holes==='18');yi.push({label:"'"+String(y).slice(2),y,v:roundsCount(rr),avg:avg(r18.map(r=>r.score)),ad:avg(rr.filter(r=>r.diff!=null).map(r=>r.diff)),low:r18.length?Math.min(...r18.map(r=>r.score)):null,vl:roundsCount(rr)})}
  const el3=$('#yearChart');if(el3)barChart(el3,yi,{h:170,label:'Rounds by year',valueLabels:true,fmt:p=>`<b>${p.y}</b> · ${p.v} rounds<br>Avg ${fx(p.avg)} · diff ${fx(p.ad)}`});
  const yt=$('#yearTable');if(yt)yt.innerHTML=`<table class="tbl"><thead><tr><th>Year</th><th class="n">Rounds</th><th class="n">Avg</th><th class="n">Best</th><th class="n">Avg diff</th><th class="n">Year-end</th></tr></thead><tbody>${yi.slice().reverse().filter(y=>y.v).map(y=>{const ye=[...C].reverse().find(r=>r.date.slice(0,4)<=String(y.y)&&r.hiAfter!=null);return`<tr class="tap" data-drill="year:${y.y}" tabindex="0"><td class="y">${y.y}</td><td class="n">${y.v}</td><td class="n">${fx(y.avg)}</td><td class="n">${y.low??'—'}</td><td class="n">${fx(y.ad)}</td><td class="n">${hiStr(ye&&ye.hiAfter)}</td></tr>`}).join('')}</tbody></table>`;
  // months
  const ms=Array.from({length:12},()=>[]);d.forEach(r=>ms[+r.date.slice(5,7)-1].push(r.diff));
  const mn=['J','F','M','A','M','J','J','A','S','O','N','D'],mf=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const overall=avg(d.map(r=>r.diff));
  const mi=ms.map((a,i)=>({label:mn[i],v:a.length?avg(a):0,n:a.length,m:mf[i],vl:a.length?fx(avg(a)):'',color:a.length&&avg(a)<=overall?'var(--accent)':'var(--faint)'}));
  const el4=$('#monthChart');if(el4)barChart(el4,mi,{h:170,label:'Average differential by month',fmt:p=>p.n?`<b>${p.m}</b> · avg diff ${fx(p.v)}<br>${p.n} rounds`:`<b>${p.m}</b> · no rounds`});
  // distribution
  const r18=C.filter(r=>r.holes==='18');const lo=Math.min(...r18.map(r=>r.score)),hi=Math.max(...r18.map(r=>r.score));const yr=daysAgo(365);
  const bins=[];for(let s=lo;s<=hi;s++){const recent=r18.filter(r=>r.score===s&&r.date>=yr).length,older=r18.filter(r=>r.score===s&&r.date<yr).length;bins.push({label:String(s),s,recent,older,v:recent+older})}
  const el5=$('#distChart');if(el5){barChart(el5,bins.map(b=>({...b,color:'var(--faint)'})),{h:170,label:'Score distribution',fmt:p=>`<b>${p.s}</b> · ${p.v} rounds<br>${p.recent} in last 12 mo`});
    // overlay recent portion
    const svg=el5.querySelector('svg');const W=+svg.getAttribute('viewBox').split(' ')[2],H=170,L=26,R=6,T=16,B=22;const vmax=Math.max(...bins.map(b=>b.v),1);const tk=niceTicks(0,vmax,3);const top=tk[tk.length-1];const bw=(W-L-R)/bins.length;
    let o='';bins.forEach((b,i)=>{if(!b.recent)return;const x=L+i*bw+bw*.18,w=Math.max(2,bw*.64),h=b.recent/top*(H-T-B);o+=`<rect x="${x}" y="${H-B-h}" width="${w}" height="${h}" fill="var(--accent)"/>`});
    svg.insertAdjacentHTML('beforeend',o);svg.appendChild(svg.querySelector('.cross'))}
}

/* ---------- course handicap ---------- */
function currentHI(){const l=[...S.calc].reverse().find(x=>x.hiAfter!=null);return l?l.hiAfter:null}
function chStr(ch){return ch==null?'—':ch<0?'+'+(-ch):String(ch)}
function courseHcp(hi,c,mode){if(hi==null||!c)return{ch:null};
  const nine=c.holes!=='18'||mode!=='18';let rating=+c.rating,par=+(c.par||(c.holes==='18'?72:36)),est=false;
  if(c.holes==='18'&&nine){rating=rating/2;par=par/2;est=true}
  const raw=(nine?hi/2:hi)*c.slope/113+(rating-par);return{ch:Math.round(raw),raw,nine,est,parSet:!!c.par,rating,par}}
function strokeRules(ch,nine){const n=nine?9:18,lbl=nine?'on this nine':'';
  if(ch==null)return[];
  if(ch===0)return[['Strokes','None. You play this course at scratch.'],['Max hole score','Par + 2 on every hole']];
  if(ch<0)return[['Strokes',`Plus handicap: give back ${-ch} stroke${ch<-1?'s':''} on the ${-ch} easiest hole${ch<-1?'s':''} ${lbl}`.trim()],['Max hole score',`Par + 1 on those hole${ch<-1?'s':''}, par + 2 elsewhere`]];
  if(nine){if(ch<=9)return[['Strokes',`1 stroke on the ${ch} hardest hole${ch>1?'s':''} on this nine`],['Max hole score',`Par + 3 on those, par + 2 on the rest`]];
    return[['Strokes',`2 strokes on the ${ch-9} hardest, 1 on the other ${18-ch}`],['Max hole score','Par + 4 where you get 2, par + 3 elsewhere']]}
  if(ch<=18)return[['Strokes',`1 stroke on SI 1–${ch}`],['Max hole score',ch===18?'Par + 3 on every hole':`SI 1–${ch}: par + 3 · SI ${ch+1}–18: par + 2`]];
  return[['Strokes',`2 strokes on SI 1–${ch-18}, 1 on SI ${ch-17}–18`],['Max hole score',`SI 1–${ch-18}: par + 4 · SI ${ch-17}–18: par + 3`]]}
function openCalc(id){
  const st={c:id?S.courses.find(x=>x.id===id):null,mode:'18',hi:currentHI()};
  if(st.c&&st.c.holes!=='18')st.mode='F9';
  $('#sheetHost').innerHTML=`<div class="sheet-bg" id="sbg"><div class="sheet" role="dialog" aria-label="Course handicap"><div class="grab" aria-hidden="true"></div>
   <div class="row-head"><h3>Course handicap</h3><button class="linkbtn" type="button" id="dclose">Close</button></div>
   <div class="chips" id="k-recent"></div>
   <label for="k-search">Course<input id="k-search" type="search" placeholder="Search your saved courses" autocomplete="off"></label>
   <div class="picked" id="k-picked" hidden></div>
   <div class="picker" id="k-picker" role="listbox" aria-label="Saved courses"></div>
   <div class="segw" id="k-mode"><button type="button" data-m="F9">Front 9</button><button type="button" data-m="18">18 holes</button><button type="button" data-m="B9">Back 9</button></div>
   <div class="grid2"><label for="k-hi">Handicap index<input id="k-hi" type="number" inputmode="decimal" step="0.1" value="${st.hi??''}"></label>
    <label for="k-par">Par<input id="k-par" type="number" inputmode="numeric"></label></div>
   <div id="k-out"></div></div></div>`;
  sheetOpened();
  const counts=new Map();S.rounds.forEach(x=>{const k=courseKey(x.course,x.tee,x.holes);counts.set(k,(counts.get(k)||0)+1)});
  const cnt=c=>counts.get(courseKey(c.course,c.tee,c.holes))||0;
  const recent=()=>{const seen=new Set(),out=[];for(const x of sortRounds(S.rounds).reverse()){const k=courseKey(x.course,x.tee,x.holes);if(seen.has(k))continue;seen.add(k);const c=S.courses.find(cc=>courseKey(cc.course,cc.tee,cc.holes)===k);if(c)out.push(c);if(out.length>=5)break}
    $('#k-recent').innerHTML=out.map(c=>`<button type="button" class="chip" data-cid="${c.id}">${esc(shortCourse(c.course))}<small>${esc(c.tee)}</small></button>`).join('');$('#k-recent').hidden=!!st.c||!out.length};
  const pick=()=>{const q=$('#k-search').value.trim().toLowerCase();
    const list=S.courses.filter(c=>!q||c.course.toLowerCase().includes(q)||c.tee.toLowerCase().includes(q)).sort((a,b)=>cnt(b)-cnt(a)).slice(0,40);
    $('#k-picker').innerHTML=list.map(c=>`<button type="button" role="option" data-cid="${c.id}">${esc(c.course)}<br><small>${esc(c.tee)} · ${c.holes==='18'?'18':'9'} holes · ${fx(+c.rating)} / ${c.slope}</small></button>`).join('')||'<p class="note" style="padding:10px 12px">No saved match. Add the course on the Courses tab.</p>';
    $('#k-picker').hidden=!!st.c;$('#k-picked').hidden=!st.c;
    if(st.c)$('#k-picked').innerHTML=`<div>${esc(st.c.course)}<small>${esc(st.c.tee)} · ${fx(+st.c.rating)} / ${st.c.slope}</small></div><button type="button" class="linkbtn" id="k-chg">Change</button>`};
  const out=()=>{const c=st.c;
    $('#k-mode').querySelectorAll('button').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.m===st.mode);b.disabled=!!c&&c.holes!=='18'&&b.dataset.m==='18'});
    if(!c){$('#k-par').value='';$('#k-out').innerHTML='<p class="note">Pick a course and tee to see your course handicap.</p>';return}
    const full=c.par||(c.holes==='18'?72:36);if(document.activeElement!==$('#k-par'))$('#k-par').value=st.mode!=='18'&&c.holes==='18'?full/2:full;
    const hi=$('#k-hi').value===''?null:+$('#k-hi').value;const r=courseHcp(hi,c,st.mode);
    if(r.ch==null){$('#k-out').innerHTML='<p class="note">Enter a handicap index.</p>';return}
    const rules=strokeRules(r.ch,r.nine);
    $('#k-out').innerHTML=`<div class="chbig"><b class="num">${chStr(r.ch)}</b><div><strong>Course handicap</strong>${esc(shortCourse(c.course))}, ${esc(c.tee)}${r.nine?` · ${st.mode==='B9'?'back':'front'} 9`:''}<br>Index ${hiStr(hi)} × ${c.slope}/113 + (${fx(r.rating)} − ${r.par})</div></div>
     <div class="rules">${rules.map(([k,v])=>`<div><span>${k}</span><b>${v}</b></div>`).join('')}</div>
     ${r.est?'<p class="note">This nine is estimated from the 18-hole rating, since nine-hole ratings aren’t saved for this tee.</p>':''}
     ${!r.parSet?`<p class="note">Par isn't saved for this tee, so ${c.holes==='18'?72:36} is assumed. Change it above and it's saved to the course.</p>`:''}`};
  const choose=cid=>{st.c=S.courses.find(x=>x.id===cid);if(st.c&&st.c.holes!=='18'&&st.mode==='18')st.mode='F9';$('#k-search').value='';$('#k-search').blur();pick();recent();out()};
  $('#sbg').addEventListener('click',e=>{if(e.target.id==='sbg'||e.target.id==='dclose'){closeSheet();return}
    const b=e.target.closest('[data-cid]');if(b){choose(b.dataset.cid);return}
    if(e.target.closest('#k-chg')){st.c=null;pick();recent();out();$('#k-search').focus();return}
    const m=e.target.closest('[data-m]');if(m&&!m.disabled){st.mode=m.dataset.m;out()}});
  $('#k-search').addEventListener('input',()=>{st.c=null;pick();recent();out()});
  $('#k-hi').addEventListener('input',out);
  $('#k-par').addEventListener('change',async()=>{const c=st.c;const v=+$('#k-par').value;if(!c||!v)return;
    const full=st.mode!=='18'&&c.holes==='18'?v*2:v;if(full===c.par)return;
    const upd={...c,par:full};st.c=upd;out();try{await saveCourses(S.courses.map(x=>x.id===c.id?upd:x));toast('Par saved')}catch(ex){toast(saveErr(ex))}});
  pick();recent();out();
}

/* ---------- drill-down sheets ---------- */
function roundRows(list){return list.map(r=>`<div class="li tap" data-rid-edit="${r.id}" role="button" tabindex="0"><div class="t">${esc(r.course)}<div class="m">${fmtD(r.date)} · ${esc(r.tee)}${r.holes!=='18'?' · '+holesLabel(r.holes):''} · ${fx(r.rating)}/${r.slope}</div></div><div class="r num">${r.score}<small>diff ${fx(r.diff)}</small></div></div>`).join('')}
function statBlock(list){const d=list.filter(r=>r.diff!=null),s18=list.filter(r=>r.holes==='18');
  return `<div class="stat4"><div><b class="num">${(n=>n%1?fx(n):n)(roundsCount(list))}</b><small>Rounds</small></div><div><b class="num">${fx(avg(s18.map(r=>r.score)))}</b><small>Avg score</small></div><div><b class="num">${fx(avg(d.map(r=>r.diff)))}</b><small>Avg diff</small></div><div><b class="num">${s18.length?Math.min(...s18.map(r=>r.score)):'—'}</b><small>Best</small></div></div>`}
function openDrill(title,sub,list,extra=''){
  const rows=list.slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
  $('#sheetHost').innerHTML=`<div class="sheet-bg" id="sbg"><div class="sheet" role="dialog" aria-label="${esc(title)}"><div class="grab" aria-hidden="true"></div>
   <div class="row-head"><h3>${esc(title)}</h3><button class="linkbtn" type="button" id="dclose">Close</button></div>${sub?`<p class="sub">${sub}</p>`:''}
   ${statBlock(list)}${extra}
   ${rows.filter(r=>r.diff!=null).length>=3?'<div class="chart" id="drillChart"></div>':''}
   <div class="list">${roundRows(rows)||'<p class="note">No rounds.</p>'}</div>
   <p class="note">Tap a round to edit it.</p></div></div>`;
  sheetOpened();
  $('#sbg').addEventListener('click',e=>{if(e.target.id==='sbg'||e.target.id==='dclose'){closeSheet();return}
    const r=e.target.closest('[data-rid-edit]');if(r){closeSheet();openSheet(r.dataset.ridEdit);return}
    const c=e.target.closest('[data-cedit]');if(c){closeSheet();openCourseSheet(c.dataset.cedit);return}
    const k=e.target.closest('[data-calc]');if(k){closeSheet();openCalc(k.dataset.calc)}});
  const el=$('#drillChart');if(el){const T=d=>Date.parse(d+'T12:00:00Z');const pts=sortRounds(list).filter(r=>r.diff!=null).map(r=>({t:T(r.date),v:r.diff,r}));
    timeChart(el,[{pts,kind:'line',color:'var(--faint)',w:1.5},{pts,kind:'dots',color:'var(--accent)'}],{h:150,label:'Differentials',fmt:p=>`<b>${fx(p.v)}</b> · ${p.r.score}<br>${fmtD(p.r.date)} · ${esc(p.r.tee)}`})}
}
function drill(key){const [kind,...rest]=key.split(':');const val=rest.join(':');
  if(kind==='slope'){const b=SLOPE_BINS[+val],rs=rangeStart(S.slopeRange);const lbl={'1y':'last 12 months','3y':'last 3 years','all':'all time'}[S.slopeRange];
    openDrill(`Slope ${b.label}`,`Rounds on courses with slope ${esc(b.label)}, ${lbl}.`,S.calc.filter(r=>r.diff!=null&&r.date>=rs&&r.slope>=b.lo&&r.slope<=b.hi))}
  else if(kind==='year'){openDrill(`${val} season`,'',S.calc.filter(r=>r.date.startsWith(val)))}
  else if(kind==='course'){const name=decodeURIComponent(val);const list=S.calc.filter(r=>r.course===name);
    const tees=S.courses.filter(c=>c.course===name);const play=t=>list.filter(r=>courseKey(r.course,r.tee,r.holes)===courseKey(t.course,t.tee,t.holes));
    const all=avg(S.calc.filter(r=>r.diff!=null).map(r=>r.diff)),here=avg(list.filter(r=>r.diff!=null).map(r=>r.diff));
    const vs=here!=null&&list.length>=3?`<p class="sub">You average ${fx(here)} here vs. ${fx(all)} overall, so you play <b>${fx(Math.abs(here-all))} strokes ${here<=all?'better':'worse'}</b> than usual relative to the rating.</p>`:'';
    const teeHtml=tees.length?`<div class="teelist">${tees.map(t=>`<div class="teerow"><div>${esc(t.tee)} · ${t.holes==='18'?'18':'9'} holes<small>${fx(t.rating)} / ${t.slope} · ${play(t).length} played</small></div><span style="display:flex;gap:12px"><button class="linkbtn" type="button" data-calc="${t.id}">HCP ${chStr(courseHcp(currentHI(),t,t.holes==='18'?'18':'F9').ch)}</button><button class="linkbtn" type="button" data-cedit="${t.id}">Edit</button></span></div>`).join('')}</div>`:'';
    openDrill(name,'',list,vs+teeHtml)}
}

   <h3>${r?'Edit round':'Post a round'}</h3>
   <div class="grid2"><label for="f-date">Date<input id="f-date" type="date" value="${st.date}" required></label>
    <label for="f-holes">Holes<select id="f-holes"><option value="18">18 holes</option><option value="F9">Front 9</option><option value="B9">Back 9</option></select></label></div>
   <div class="chips" id="recent" aria-label="Recent courses"></div>
   <label for="f-search">Course<input id="f-search" type="search" placeholder="Search your saved courses" autocomplete="off" value="${esc(st.course)}"></label>
   <div class="picked" id="picked" hidden></div>
   <div class="picker" id="picker" role="listbox" aria-label="Saved courses"></div>
   <label for="f-tee">Tee<input id="f-tee" value="${esc(st.tee)}" placeholder="e.g. Blue"></label>
   <div class="grid2"><label for="f-rating">Rating<input id="f-rating" type="number" inputmode="decimal" step="0.1" value="${st.rating}"></label>
    <label for="f-slope">Slope<input id="f-slope" type="number" inputmode="numeric" value="${st.slope}"></label></div>
   <label for="f-score">Adjusted gross score<input id="f-score" type="number" inputmode="numeric" value="${st.score}" placeholder="e.g. 86"></label>
   <p class="note">Use net double bogey as your max on any hole, same as GHIN. A new course and tee is saved automatically.</p>
   <div class="preview" id="pv"></div>
   <p class="note" id="ferr" style="color:var(--bad)" hidden></p>
   <div class="actions"><button class="btn ghost" type="button" id="fcancel">Cancel</button><button class="btn" type="submit" id="fsave">${r?'Save changes':'Post round'}</button></div>
  </form></div>`;
  $('#f-holes').value=st.holes;
  const pick=()=>{const q=$('#f-search').value.trim().toLowerCase();const h=$('#f-holes').value==='18'?'18':'9';
    const list=S.courses.filter(c=>c.holes===h&&(!q||c.course.toLowerCase().includes(q)||c.tee.toLowerCase().includes(q)));
    const counts=new Map();S.rounds.forEach(x=>{const k=courseKey(x.course,x.tee,x.holes);counts.set(k,(counts.get(k)||0)+1)});
    list.sort((a,b)=>(counts.get(courseKey(b.course,b.tee,b.holes))||0)-(counts.get(courseKey(a.course,a.tee,a.holes))||0));
    $('#picker').innerHTML=list.slice(0,40).map(c=>`<button type="button" role="option" data-cid="${c.id}" aria-selected="${st.picked===courseKey(c.course,c.tee,c.holes)}">${esc(c.course)}<br><small>${esc(c.tee)} · ${fx(c.rating)} / ${c.slope}</small></button>`).join('')||`<p class="note" style="padding:10px 12px">No saved match. Type the course name, then fill in tee, rating and slope.</p>`};
  const preview=()=>{const sc=+$('#f-score').value,ra=+$('#f-rating').value,sl=+$('#f-slope').value,h=$('#f-holes').value;
    if(!sc||!ra||!sl){$('#pv').innerHTML='<span class="note">Enter score, rating and slope to preview the differential.</span>';return}
    const tmp={id:'__p',date:$('#f-date').value||todayStr(),course:$('#f-search').value,tee:$('#f-tee').value,holes:h,score:sc,rating:ra,slope:sl,seq:9,createdAt:Date.now()};
    const base=S.rounds.filter(x=>x.id!==(r&&r.id));const now=computeAll(base),after=computeAll([...base,tmp]);
    const me=after.find(x=>x.id==='__p');const hiNow=[...now].reverse().find(x=>x.hiAfter!=null),hiAfter=[...after].reverse().find(x=>x.hiAfter!=null);
    $('#pv').innerHTML=`<div><span>Differential</span><b class="num">${fx(me.diff)}</b></div><div><span>Index now</span><b class="num">${hiStr(hiNow&&hiNow.hiAfter)}</b></div><div><span>Index after</span><b class="num">${hiStr(hiAfter&&hiAfter.hiAfter)}</b></div>`};
  const showPicked=()=>{const on=!!st.picked;$('#picker').hidden=on;$('#picked').hidden=!on;
    if(on)$('#picked').innerHTML=`<div>${esc($('#f-search').value)}<small>${esc($('#f-tee').value)} · ${fx(+$('#f-rating').value)} / ${$('#f-slope').value}</small></div><button type="button" class="linkbtn" id="chgCourse">Change</button>`};
  const recent=()=>{const seen=new Set(),out=[];const h9=$('#f-holes').value==='18'?'18':'9';
    for(const x of sortRounds(S.rounds).reverse()){const k=courseKey(x.course,x.tee,x.holes);if(seen.has(k))continue;seen.add(k);
      const c=S.courses.find(cc=>courseKey(cc.course,cc.tee,cc.holes)===k);if(c&&c.holes===h9)out.push(c);if(out.length>=5)break}
    $('#recent').innerHTML=out.map(c=>`<button type="button" class="chip" data-cid="${c.id}">${esc(shortCourse(c.course))}<small>${esc(c.tee)}</small></button>`).join('');
    $('#recent').hidden=!!st.picked||!out.length};
  const choose=id=>{const c=S.courses.find(x=>x.id===id);if(!c)return;
    st.picked=courseKey(c.course,c.tee,c.holes);$('#f-search').value=c.course;$('#f-tee').value=c.tee;$('#f-rating').value=c.rating;$('#f-slope').value=c.slope;$('#f-search').blur();pick();showPicked();recent();preview();$('#f-score').focus()};
  $('#recent').addEventListener('click',e=>{const b=e.target.closest('[data-cid]');if(b)choose(b.dataset.cid)});
  pick();preview();showPicked();recent();
  $('#picked').addEventListener('click',e=>{if(e.target.closest('#chgCourse')){st.picked=null;showPicked();pick();recent();$('#f-search').focus()}});
  $('#f-search').addEventListener('input',()=>{st.picked=null;showPicked();pick();recent()});
  $('#f-search').addEventListener('focus',()=>{if(st.picked){st.picked=null;showPicked();pick();recent()}});
  $('#f-holes').addEventListener('change',()=>{st.picked=null;showPicked();pick();recent();preview()});
  ['f-score','f-rating','f-slope','f-date'].forEach(id=>$('#'+id).addEventListener('input',preview));
  $('#picker').addEventListener('click',e=>{const b=e.target.closest('[data-cid]');if(b)choose(b.dataset.cid)});
  const close=closeSheet;sheetOpened();
  $('#fcancel').onclick=close;$('#sbg').addEventListener('click',e=>{if(e.target.id==='sbg')close()});
  $('#pform').addEventListener('submit',async e=>{e.preventDefault();
    const v={date:$('#f-date').value,course:$('#f-search').value.trim(),tee:$('#f-tee').value.trim(),holes:$('#f-holes').value,score:+$('#f-score').value,rating:+$('#f-rating').value,slope:+$('#f-slope').value};
    const err=v.date?!v.course?'Pick or type a course.':!v.tee?'Enter the tee.':!(v.rating>25&&v.rating<90)?'Course rating looks off. Check the scorecard.':!(v.slope>=55&&v.slope<=155)?'Slope must be between 55 and 155.':!(v.score>=25&&v.score<=200)?'Enter the adjusted gross score.':'':'Pick a date.';
    if(err){$('#ferr').textContent=err;$('#ferr').hidden=false;return}
    $('#fsave').disabled=true;
    try{
      const sameDay=S.rounds.filter(x=>x.date===v.date&&(!r||x.id!==r.id)).length;
      const rec=r?{...r,...v}:{id:'r'+Date.now().toString(36),...v,seq:sameDay+1,createdAt:Date.now()};
      const rounds=r?S.rounds.map(x=>x.id===r.id?rec:x):[...S.rounds,rec];
      const k=courseKey(v.course,v.tee,v.holes);let courses=S.courses;
      if(!courses.some(c=>courseKey(c.course,c.tee,c.holes)===k)){courses=[...courses,{id:'c'+Date.now().toString(36),course:v.course,tee:v.tee,holes:v.holes==='18'?'18':'9',rating:v.rating,slope:v.slope}]}
      await saveRounds(rounds);if(courses!==S.courses)await saveCourses(courses);
      close();toast(r?'Round updated':'Round posted');
    }catch(ex){$('#ferr').textContent=saveErr(ex);$('#ferr').hidden=false;$('#fsave').disabled=false}
  });
}
function openCourseSheet(id){
  const c=id?S.courses.find(x=>x.id===id):null;const host=$('#sheetHost');
  host.innerHTML=`<div class="sheet-bg" id="sbg"><form class="sheet" id="cform" novalidate><div class="grab" aria-hidden="true"></div><h3>${c?'Edit course':'Add course'}</h3>
   <label for="c-name">Course<input id="c-name" value="${esc(c?c.course:'')}"></label>
   <div class="grid2"><label for="c-tee">Tee<input id="c-tee" value="${esc(c?c.tee:'')}"></label><label for="c-holes">Holes<select id="c-holes"><option value="18">18</option><option value="9">9</option></select></label></div>
   <div class="grid2"><label for="c-rating">Rating<input id="c-rating" type="number" step="0.1" inputmode="decimal" value="${c?c.rating:''}"></label><label for="c-slope">Slope<input id="c-slope" type="number" inputmode="numeric" value="${c?c.slope:''}"></label></div>
   <label for="c-par">Par<input id="c-par" type="number" inputmode="numeric" value="${c&&c.par?c.par:''}" placeholder="${c&&c.holes==='9'?'36':'72'}"></label>
   <p class="note">Changing rating or slope here affects future posts only. Rounds already posted keep their own numbers.</p>
   <p class="note" id="cerr" style="color:var(--bad)" hidden></p>
   <div class="actions">${c?`<button class="btn danger" type="button" id="cdel">Remove</button><span style="flex:1"></span>`:''}<button class="btn ghost" type="button" id="ccancel">Cancel</button><button class="btn" type="submit">Save course</button></div></form></div>`;
  if(c)$('#c-holes').value=c.holes;
  const close=closeSheet;sheetOpened();$('#ccancel').onclick=close;$('#sbg').addEventListener('click',e=>{if(e.target.id==='sbg')close()});
  if(c)$('#cdel').onclick=async()=>{const b=$('#cdel');if(b.dataset.arm!=='1'){b.dataset.arm='1';b.textContent='Tap again to remove';return}
    try{await saveCourses(S.courses.filter(x=>x.id!==c.id));close();toast('Course removed')}catch(ex){$('#cerr').textContent=saveErr(ex);$('#cerr').hidden=false}};
  $('#cform').addEventListener('submit',async e=>{e.preventDefault();
    const v={course:$('#c-name').value.trim(),tee:$('#c-tee').value.trim(),holes:$('#c-holes').value,rating:+$('#c-rating').value,slope:+$('#c-slope').value};if(+$('#c-par').value)v.par=+$('#c-par').value;
    if(!v.course||!v.tee||!v.rating||!v.slope){$('#cerr').textContent='Fill in course, tee, rating and slope.';$('#cerr').hidden=false;return}
    try{await saveCourses(c?S.courses.map(x=>x.id===c.id?{...c,...v}:x):[...S.courses,{id:'c'+Date.now().toString(36),...v}]);close();toast('Course saved')}
    catch(ex){$('#cerr').textContent=saveErr(ex);$('#cerr').hidden=false}});
}

/* ---------- persistence ---------- */
function saveErr(ex){return ex&&ex.code==='permission-denied'?'The database refused the save. Check the Firestore rules.':'Could not save. Check your connection and try again.'}
async function saveRounds(items){if(!S.db)throw{code:'unavailable'};S.rounds=items;derive();render();await S.db.collection('golf').doc('rounds').set({items})}
async function saveCourses(items){if(!S.db)throw{code:'unavailable'};S.courses=items;render();await S.db.collection('golf').doc('courses').set({items})}

async function checkUpdate(){
  toast('Checking for an update…');
  try{
    const res=await fetch(location.pathname+'?t='+Date.now(),{cache:'no-store'});
    if(!res.ok)throw new Error(res.status);
    const m=(await res.text()).match(/const VERSION = '([^']+)'/);
    if(!m)throw new Error('no version');
    if(m[1]===VERSION)return toast(`You have the latest version (${VERSION}).`);
    toast(`Updating to version ${m[1]}…`);
    await fetch(location.href,{cache:'reload'}).catch(()=>{});
    setTimeout(()=>location.reload(),700);
  }catch(e){toast('Couldn’t check for an update. Check the internet connection and try again.')}
}

/* ---------- events ---------- */
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;S.tab=b.dataset.tab;S.expanded=null;render();window.scrollTo({top:0})});
$('#postBtn').addEventListener('click',()=>openSheet(null));
$('#main').addEventListener('click',async e=>{
  const sg=e.target.closest('[data-seg] button');if(sg){S[sg.parentElement.dataset.seg]=sg.dataset.v;render();return}
  const dr=e.target.closest('[data-drill]');if(dr){drill(dr.dataset.drill);return}
  const go=e.target.closest('[data-goto]');if(go){S.tab=go.dataset.goto;render();window.scrollTo({top:0});return}
  const ed=e.target.closest('[data-edit]');if(ed){openSheet(ed.dataset.edit);return}
  const dl=e.target.closest('[data-del]');if(dl){if(dl.dataset.arm!=='1'){dl.dataset.arm='1';dl.textContent='Tap again to delete';return}
    try{await saveRounds(S.rounds.filter(x=>x.id!==dl.dataset.del));S.expanded=null;render();toast('Round deleted')}catch(ex){toast(saveErr(ex))}return}
  const ce=e.target.closest('[data-cedit]');if(ce){openCourseSheet(ce.dataset.cedit);return}
  if(e.target.closest('#addCourse')){openCourseSheet(null);return}
  if(e.target.closest('#updBtn')){checkUpdate();return}
  if(e.target.closest('#calcBtn')){openCalc(null);return}
  const row=e.target.closest('[data-rid]');if(row&&!e.target.closest('button')){S.expanded=S.expanded===row.dataset.rid?null:row.dataset.rid;render()}
});
$('#main').addEventListener('keydown',e=>{const dk=e.target.closest('[data-drill]');if(dk&&(e.key==='Enter'||e.key===' ')){e.preventDefault();drill(dk.dataset.drill);return}const cr=e.target.closest('[data-cedit]');if(cr&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openCourseSheet(cr.dataset.cedit);return}const row=e.target.closest('[data-rid]');if(row&&(e.key==='Enter'||e.key===' ')&&e.target===row){e.preventDefault();S.expanded=S.expanded===row.dataset.rid?null:row.dataset.rid;render()}});
$('#main').addEventListener('input',e=>{if(e.target.id==='rq'){S.q=e.target.value;render()}if(e.target.id==='cq'){S.cq=e.target.value;render()}});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S.tab==='overview'||S.tab==='trends')drawCharts()},150)});

(async()=>{
  let db;
  try{firebase.initializeApp(firebaseConfig);db=firebase.firestore();
    try{await db.enablePersistence({synchronizeTabs:true})}catch(e){}
  }catch(e){$('#loading').textContent='Could not start the database. Check your connection and reload.';return}
  S.db=db;
  const roundsRef=db.collection('golf').doc('rounds'),coursesRef=db.collection('golf').doc('courses');
  const timer=setTimeout(()=>{if(!S.ready.r)$('#loading').textContent='Still connecting to your saved rounds…'},10000);
  let seeding=false;
  async function seedIfNew(){ // first launch: load the GHIN history bundled with the app
    if(seeding)return;seeding=true;
    try{const res=await fetch('seed.json',{cache:'no-store'});const seed=await res.json();
      await roundsRef.set({items:seed.rounds});const c=await coursesRef.get();if(!c.exists)await coursesRef.set({items:seed.courses});
      toast('Loaded '+seed.rounds.length+' rounds from your GHIN history')}
    catch(e){$('#main').innerHTML='<div class="card empty">Could not load your history. '+(e&&e.code==='permission-denied'?'The Firestore rules are blocking writes.':'Check your connection and reload.')+'</div>'}
  }
  roundsRef.onSnapshot(s=>{clearTimeout(timer);
      if(!s.exists){if(!s.metadata.fromCache)seedIfNew();return}
      S.rounds=s.data().items||[];S.ready.r=true;derive();render()},
    err=>{clearTimeout(timer);$('#main').innerHTML='<div class="card empty">Could not load your rounds. '+(err.code==='permission-denied'?'The Firestore rules are blocking reads.':'Reopen the app to try again.')+'</div>'});
  coursesRef.onSnapshot(s=>{S.courses=s.exists?(s.data().items||[]):[];S.ready.c=true;if(S.ready.r&&S.tab==='courses')render()},()=>{});
